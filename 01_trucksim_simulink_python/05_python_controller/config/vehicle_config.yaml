# 车辆与控制配置（阶段二）
# 车辆参数与 cpar(ORAC-BLFISMC1017) / 阶段一 three_parameter1.m 保持一致
vehicle:
  name: ORAC-BLFISMC1017
  m_kg: 375            # 整车质量 kg
  ms_kg: 205           # 簧上质量 kg
  g_mps2: 9.8
  iz_kgm2: 295.552     # 绕 z 轴转动惯量
  # 各轴相对质心的纵向位置，单位 m，前正后负（来自 cpar：轴位置 0/1033/2016 mm，质心 1058 mm）
  axle_positions_m: [1.058, 0.025, -0.958]
  wheelbase_m: 2.016
  track_m: 1.67
  # 各轴等效侧偏刚度（左右合计，N/rad，负值）
  tire_cornering_N_per_rad: [-10000.0, -11710.8, -14550.0]

controller:
  mode: zero_sideslip   # 零质心侧偏角多轴转角分配
  kp_beta: 0.60         # 质心侧偏角比例反馈增益（可选，0 表示纯前馈）
  ki_beta: 0.50         # 质心侧偏角积分反馈增益
  max_steer_deg: 20.0   # 各轴转角限幅（deg）

trucksim:
  run_name: "ORAC-BLFISMC1017 #phase2"   # 固定联仿 Run 名称（COM 配置用，需按目标机确认）
  com_progids: ["TruckSim.Application", "TruckSim2019.Application", "TS.Application"]  # 可尝试的 COM 程序标识
  simfile_path: "D:/04_trucksim/TruckSim2019.0_Data/simfile.sim"  # COM 不可用时，按该 simfile 定位并修改 Run_all.par
  allow_par_file_patch: true              # 方法2：直接修改 Simulink S-Function 实际读取的 Run_all.par
  road_base_mu: 0.85                     # 当前道路数据集基准附着系数（MY_FRICTION 为倍率）
  # TXT 字段到 TruckSim COM 关键字的集中映射。若目标机控件名不同，只改这里。
  com_keywords:
    stop_time_s: ["TSTOP"]
    initial_speed_kmh: ["SPEED"]
    target_speed_kmh: ["SPEED_TARGET_CONSTANT"]
    road_friction_scale: ["MY_FRICTION"]
    init_speed_enable: ["OPT_INIT_SPEED"]
    # road_grade: ["ROAD_GRADE"]          # 目标机确认坡度控件后再启用
  # 场景名到 TruckSim 数值参数的映射。straight_road 是当前固定 Run 默认场景。
  scenario_map:
    straight_road: {}
